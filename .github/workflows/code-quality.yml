name: Code Quality

on: 
    pull_request:
        branches: main

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                python-version: "3.12"
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade
                pip install black flake8
            
            - name: Check formatting (Check)
              run: black --check

            - name: Lint code (Flake8)
              run: flake8 .